name: Publish

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Determine package version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ]; then
            echo "This workflow must be triggered by a tag; GITHUB_REF_NAME is empty."
            exit 1
          fi
          # Strip any leading non-digit characters (like v, rel-, lib-)
          VERSION="$(printf "%s" "$TAG" | sed -E 's/^[^0-9]*([0-9].*)/\1/')"
          if [ -z "$VERSION" ]; then
            echo "Failed to parse version from tag '$TAG'"
            exit 1
          fi
          echo "Using package version: $VERSION (from tag '$TAG')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: |
          dotnet restore Abstractions/Abstractions.csproj
          dotnet restore XJson.Generator/XJson.Generator.csproj

      - name: Pack
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Packing with version: $VERSION"
          dotnet pack Abstractions/Abstractions.csproj -c Release -o ./artifacts -p:Version=$VERSION -p:PackageVersion=$VERSION
          dotnet pack XJson.Generator/XJson.Generator.csproj -c Release -o ./artifacts -p:Version=$VERSION -p:PackageVersion=$VERSION

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY secret is not set."
            exit 1
          fi
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
